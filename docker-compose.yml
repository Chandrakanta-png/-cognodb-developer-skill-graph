services:
  backend:
    build: .
    environment:
      COGNODB_URI: ${COGNODB_URI}
      COGNODB_USER: ${COGNODB_USER:-cognodb}
      COGNODB_PASSWORD: ${COGNODB_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    command: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"